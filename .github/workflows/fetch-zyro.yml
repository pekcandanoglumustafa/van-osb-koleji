name: Eski Görselleri Kurtar

# Eski Zyro sitesindeki görselleri (logo, kapak, bölüm, galeri) indirip
# images/site/ altına kaydeder. Tek seferlik kurtarma işi içindir.
on:
  push:
    branches: ['claude/**']
    paths:
      - 'tools/zyro-urls.txt'
      - 'tools/fetch_zyro.py'
      - '.github/workflows/fetch-zyro.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Arşiv bağlantı testi
        continue-on-error: true
        run: |
          mkdir -p images/site
          out=images/site/_arsiv-testi.txt
          : > $out
          for u in "https://web.archive.org/" "https://archive.org/wayback/available?url=ozelvanosbkoleji.com" \
                   "https://web.archive.org/cdx/search/cdx?url=assets.zyrosite.com/*&filter=original:.*YD0Eeq404vF5okpN.*&limit=5" \
                   "https://web.archive.org/web/2025/https://ozelvanosbkoleji.com/"; do
            for ipv in -4 -6; do
              echo "== $ipv $u" >> $out
              curl $ipv -sS -L -m 25 -A "Mozilla/5.0" -o /tmp/r -w "%{http_code} %{size_download}B\n" "$u" >> $out 2>&1 || true
              head -c 300 /tmp/r >> $out 2>/dev/null; echo >> $out
            done
          done
          curl -sS -m 25 "https://web.archive.org/cdx/search/cdx?url=assets.zyrosite.com/*&filter=original:.*YD0Eeq404vF5okpN.*&fl=original,statuscode,length&limit=400" > images/site/_arsiv-liste.txt 2>&1 || true
          curl -sS -m 25 "https://web.archive.org/cdx/search/cdx?url=ozelvanosbkoleji.com/*&fl=timestamp,original,statuscode&collapse=urlkey&limit=200" > images/site/_arsiv-sayfalar.txt 2>&1 || true
      - name: Görselleri indir
        run: python3 tools/fetch_zyro.py tools/zyro-urls.txt images/site
      - name: Commit'le
        run: |
          git config user.name "vanosb-content-bot"
          git config user.email "bot@ozelvanosbkoleji.com"
          git add images/site
          if git diff --staged --quiet; then
            echo "Değişiklik yok."
          else
            git commit -m "görseller: eski Zyro görselleri kurtarıldı [auto]"
            git push
          fi
